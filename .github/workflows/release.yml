name: Release

# only v* tags publish; a plain push or a non v* tag never reaches these jobs.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  macos:
    name: macOS (darwin/universal, app.zip + unsigned dmg)
    runs-on: macos-14
    steps:

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            go.sum
            cmd/informer-ui/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wails3
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8

      - name: Package universal .app
        run: |
          cd cmd/informer-ui
          wails3 task darwin:package:universal INFORMER_UI_VERSION="${{ github.ref_name }}"

      # a universal build must really contain both architectures; publishing
      # a half universal app is worse than failing the job.
      - name: Verify universal binary
        run: |
          archs=$(lipo -archs cmd/informer-ui/bin/informer.app/Contents/MacOS/informer-ui)
          echo "architectures: $archs"
          echo "$archs" | grep -q x86_64
          echo "$archs" | grep -q arm64

      - name: Verify injected version
        run: |
          shown=$(cmd/informer-ui/bin/informer.app/Contents/MacOS/informer-ui version)
          test "$shown" = "${{ github.ref_name }}"

      # updater-consumable archive: single top-level .app entry.
      # --norsrc/--noextattr avoid AppleDouble sidecars that confuse extractors.
      - name: Package app.zip for updater
        run: |
          ditto -c -k --keepParent --norsrc --noextattr \
            cmd/informer-ui/bin/informer.app \
            "informer-ui-${{ github.ref_name }}-darwin-universal.app.zip"

      - name: Package dmg (unsigned, manual install)
        run: |
          brew install create-dmg
          create-dmg \
            --volname "informer ${{ github.ref_name }}" \
            --window-size 600 400 \
            --icon-size 96 \
            --icon "informer.app" 180 190 \
            --app-drop-link 420 190 \
            --no-internet-enable \
            "informer-ui-${{ github.ref_name }}-darwin-universal.dmg" \
            "cmd/informer-ui/bin/informer.app"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin
          path: |
            informer-ui-${{ github.ref_name }}-darwin-universal.app.zip
            informer-ui-${{ github.ref_name }}-darwin-universal.dmg
          if-no-files-found: error

  windows:
    name: Windows (zip + NSIS)
    runs-on: windows-2022
    steps:

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            go.sum
            cmd/informer-ui/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wails3
        shell: bash
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8

      - name: Wails build
        shell: bash
        run: |
          cd cmd/informer-ui
          wails3 build INFORMER_UI_VERSION="${{ github.ref_name }}" CGO_ENABLED=1

      - name: Verify injected version
        shell: bash
        run: |
          shown=$(./cmd/informer-ui/bin/informer-ui.exe version)
          test "$shown" = "${{ github.ref_name }}"

      # updater-consumable archive: single top-level exe.
      - name: Package zip for updater
        shell: bash
        run: |
          cd cmd/informer-ui/bin
          powershell -Command "Compress-Archive -Path informer-ui.exe -DestinationPath '$GITHUB_WORKSPACE/informer-ui-${{ github.ref_name }}-windows-amd64.zip'"

      - name: Package NSIS installer
        shell: bash
        run: |
          cd cmd/informer-ui
          wails3 task windows:create:nsis:installer INFORMER_UI_VERSION="${{ github.ref_name }}" CGO_ENABLED=1
          mv bin/informer-ui-amd64-installer.exe \
            "${GITHUB_WORKSPACE}/informer-ui-${{ github.ref_name }}-windows-amd64-setup.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            informer-ui-${{ github.ref_name }}-windows-amd64.zip
            informer-ui-${{ github.ref_name }}-windows-amd64-setup.exe
          if-no-files-found: error

  linux:
    name: Linux (x86_64 tar.gz + deb)
    runs-on: ubuntu-24.04
    steps:

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            go.sum
            cmd/informer-ui/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ubuntu 24.04 ships WebKitGTK 4.1 only, so the build carries the
      # matching wails build tag; the runner, the packages and the tag are
      # pinned together on purpose.
      - name: Install Linux dependencies
        run: |
          # azure.archive.ubuntu.com intermittently hangs on GHA runners; fall back
          # to archive.ubuntu.com and cap apt network waits so the job fails fast.
          sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install wails3 and nfpm
        run: |
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.1

      - name: Wails build
        run: |
          cd cmd/informer-ui
          wails3 build INFORMER_UI_VERSION="${{ github.ref_name }}" EXTRA_TAGS=gtk3

      - name: Verify dynamic WebKitGTK ABI
        run: |
          ldd cmd/informer-ui/bin/informer-ui | tee /tmp/ldd.txt
          grep -q "libwebkit2gtk-4.1.so" /tmp/ldd.txt

      - name: Verify injected version
        run: |
          shown=$(cmd/informer-ui/bin/informer-ui version)
          test "$shown" = "${{ github.ref_name }}"

      - name: Package tar.gz
        run: |
          tar -czf "informer-ui-${{ github.ref_name }}-linux-amd64.tar.gz" \
            -C cmd/informer-ui/bin informer-ui

      # nfpm resolves the contents paths against the working directory, so the
      # job runs it from cmd/informer-ui; the target is absolute because the
      # verify and upload steps back in the workspace root look for it there.
      - name: Package deb
        run: |
          cd cmd/informer-ui
          # nfpm expects the binary under build/bin in the historical layout;
          # stage a copy so the existing nfpm.yaml keeps working.
          mkdir -p build/bin
          cp bin/informer-ui build/bin/informer-ui
          INFORMER_UI_VERSION="${GITHUB_REF_NAME#v}" \
            nfpm package --config build/nfpm.yaml --packager deb \
            --target "${GITHUB_WORKSPACE}/informer-ui-${{ github.ref_name }}-linux-amd64.deb"

      - name: Verify deb metadata and layout
        run: |
          dpkg-deb --info "informer-ui-${{ github.ref_name }}-linux-amd64.deb"
          dpkg-deb --contents "informer-ui-${{ github.ref_name }}-linux-amd64.deb" | grep /usr/bin/informer-ui

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            informer-ui-${{ github.ref_name }}-linux-amd64.tar.gz
            informer-ui-${{ github.ref_name }}-linux-amd64.deb
          if-no-files-found: error

  # command-line archives: package name informer-cli-*, extracted binary informer.
  # CGO is required at runtime (mattn/go-sqlite3); each cell builds natively.
  cli:
    name: CLI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-universal
            os: macos-14
            archive: informer-cli-${{ github.ref_name }}-darwin-universal.tar.gz
          - name: linux-amd64
            os: ubuntu-24.04
            archive: informer-cli-${{ github.ref_name }}-linux-amd64.tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            archive: informer-cli-${{ github.ref_name }}-linux-arm64.tar.gz
          - name: windows-amd64
            os: windows-2022
            archive: informer-cli-${{ github.ref_name }}-windows-amd64.zip
    steps:

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Install C compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential

      - name: Install MinGW (Windows CGO / sqlite)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install mingw -y --no-progress

      - name: Build and package CLI
        shell: bash
        env:
          CGO_ENABLED: '1'
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p dist/cli
          case "${{ matrix.name }}" in
            darwin-universal)
              export CGO_CFLAGS="-mmacosx-version-min=12.0"
              export CGO_LDFLAGS="-mmacosx-version-min=12.0"
              GOARCH=arm64 go build -trimpath -ldflags="-s -w" \
                -o dist/cli/informer-arm64 ./cmd/informer
              GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
                -o dist/cli/informer-amd64 ./cmd/informer
              lipo -create -output dist/cli/informer \
                dist/cli/informer-amd64 dist/cli/informer-arm64
              rm -f dist/cli/informer-amd64 dist/cli/informer-arm64
              archs=$(lipo -archs dist/cli/informer)
              echo "architectures: $archs"
              echo "$archs" | grep -q x86_64
              echo "$archs" | grep -q arm64
              tar -czf "$ARCHIVE" -C dist/cli informer
              tar -tzf "$ARCHIVE" | grep -qx informer
              ;;
            linux-*)
              go build -trimpath -ldflags="-s -w" -o dist/cli/informer ./cmd/informer
              tar -czf "$ARCHIVE" -C dist/cli informer
              tar -tzf "$ARCHIVE" | grep -qx informer
              INFORMER_HOME=$(mktemp -d) dist/cli/informer feed list
              ;;
            windows-amd64)
              export PATH="/c/ProgramData/mingw64/mingw64/bin:/c/mingw64/bin:$PATH"
              gcc --version
              go build -trimpath -ldflags="-s -w" -o dist/cli/informer.exe ./cmd/informer
              (cd dist/cli && powershell.exe -Command \
                "Compress-Archive -Path informer.exe -DestinationPath '$GITHUB_WORKSPACE/$ARCHIVE'")
              test -f "$ARCHIVE"
              ;;
            *)
              echo "unknown matrix cell: ${{ matrix.name }}" >&2
              exit 1
              ;;
          esac

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-cli-${{ matrix.name }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  # the aggregate job only collects and publishes. It depends on every
  # platform job, so a partial set of assets never becomes a release; a rerun
  # of the same tag updates the same release with identically named assets.
  publish:
    name: Publish GitHub Release
    needs: [macos, windows, linux, cli]
    runs-on: ubuntu-24.04
    steps:

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      # Fixed name SHA256SUMS so the in-app GitHub updater provider can find it
      # without knowing the release tag. The file never lists itself.
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd artifacts
          mapfile -t assets < <(find . -maxdepth 1 -type f -printf '%P\n' | sort)
          test "${#assets[@]}" -gt 0
          sha256sum "${assets[@]}" > "${RUNNER_TEMP}/SHA256SUMS"
          cat "${RUNNER_TEMP}/SHA256SUMS"
          mv "${RUNNER_TEMP}/SHA256SUMS" .

      - name: List release assets
        run: ls -la artifacts

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
