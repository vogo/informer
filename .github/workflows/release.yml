name: Release

# only v* tags publish; a plain push or a non v* tag never reaches these jobs.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  macos:
    name: macOS (darwin/universal, app.zip + unsigned dmg)
    runs-on: macos-14
    steps:

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            go.sum
            cmd/informer-ui/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8

      - name: Package universal .app
        run: |
          cd cmd/informer-ui
          wails3 task darwin:package:universal INFORMER_UI_VERSION="${{ github.ref_name }}"

      # a universal build must really contain both architectures; publishing
      # a half universal app is worse than failing the job.
      - name: Verify universal binary
        run: |
          archs=$(lipo -archs cmd/informer-ui/bin/informer-ui.app/Contents/MacOS/informer-ui)
          echo "architectures: $archs"
          echo "$archs" | grep -q x86_64
          echo "$archs" | grep -q arm64

      - name: Verify injected version
        run: |
          shown=$(cmd/informer-ui/bin/informer-ui.app/Contents/MacOS/informer-ui version)
          test "$shown" = "${{ github.ref_name }}"

      # updater-consumable archive: single top-level .app entry.
      # --norsrc/--noextattr avoid AppleDouble sidecars that confuse extractors.
      - name: Package app.zip for updater
        run: |
          ditto -c -k --keepParent --norsrc --noextattr \
            cmd/informer-ui/bin/informer-ui.app \
            "informer-ui-${{ github.ref_name }}-darwin-universal.app.zip"

      - name: Package dmg (unsigned, manual install)
        run: |
          brew install create-dmg
          create-dmg \
            --volname "informer-ui ${{ github.ref_name }}" \
            --window-size 600 400 \
            --icon-size 96 \
            --icon "informer-ui.app" 180 190 \
            --app-drop-link 420 190 \
            --no-internet-enable \
            "informer-ui-${{ github.ref_name }}-darwin-universal.dmg" \
            "cmd/informer-ui/bin/informer-ui.app"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin
          path: |
            informer-ui-${{ github.ref_name }}-darwin-universal.app.zip
            informer-ui-${{ github.ref_name }}-darwin-universal.dmg
          if-no-files-found: error

  windows:
    name: Windows (zip + NSIS)
    runs-on: windows-2022
    steps:

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            go.sum
            cmd/informer-ui/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wails3
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8

      - name: Wails build
        shell: bash
        run: |
          cd cmd/informer-ui
          wails3 build INFORMER_UI_VERSION="${{ github.ref_name }}" CGO_ENABLED=1

      - name: Verify injected version
        shell: bash
        run: |
          shown=$(./cmd/informer-ui/bin/informer-ui.exe version)
          test "$shown" = "${{ github.ref_name }}"

      # updater-consumable archive: single top-level exe.
      - name: Package zip for updater
        shell: bash
        run: |
          cd cmd/informer-ui/bin
          powershell -Command "Compress-Archive -Path informer-ui.exe -DestinationPath '$GITHUB_WORKSPACE/informer-ui-${{ github.ref_name }}-windows-amd64.zip'"

      - name: Package NSIS installer
        shell: bash
        run: |
          cd cmd/informer-ui
          wails3 task windows:create:nsis:installer INFORMER_UI_VERSION="${{ github.ref_name }}" CGO_ENABLED=1
          mv bin/informer-ui-amd64-installer.exe \
            "${GITHUB_WORKSPACE}/informer-ui-${{ github.ref_name }}-windows-amd64-setup.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            informer-ui-${{ github.ref_name }}-windows-amd64.zip
            informer-ui-${{ github.ref_name }}-windows-amd64-setup.exe
          if-no-files-found: error

  linux:
    name: Linux (x86_64 tar.gz + deb)
    runs-on: ubuntu-24.04
    steps:

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            go.sum
            cmd/informer-ui/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ubuntu 24.04 ships WebKitGTK 4.1 only, so the build carries the
      # matching wails build tag; the runner, the packages and the tag are
      # pinned together on purpose.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install wails3 and nfpm
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.1

      - name: Wails build
        run: |
          cd cmd/informer-ui
          wails3 build INFORMER_UI_VERSION="${{ github.ref_name }}" EXTRA_TAGS=gtk3

      - name: Verify dynamic WebKitGTK ABI
        run: |
          ldd cmd/informer-ui/bin/informer-ui | tee /tmp/ldd.txt
          grep -q "libwebkit2gtk-4.1.so" /tmp/ldd.txt

      - name: Verify injected version
        run: |
          shown=$(cmd/informer-ui/bin/informer-ui version)
          test "$shown" = "${{ github.ref_name }}"

      - name: Package tar.gz
        run: |
          tar -czf "informer-ui-${{ github.ref_name }}-linux-amd64.tar.gz" \
            -C cmd/informer-ui/bin informer-ui

      # nfpm resolves the contents paths against the working directory, so the
      # job runs it from cmd/informer-ui; the target is absolute because the
      # verify and upload steps back in the workspace root look for it there.
      - name: Package deb
        run: |
          cd cmd/informer-ui
          # nfpm expects the binary under build/bin in the historical layout;
          # stage a copy so the existing nfpm.yaml keeps working.
          mkdir -p build/bin
          cp bin/informer-ui build/bin/informer-ui
          INFORMER_UI_VERSION="${GITHUB_REF_NAME#v}" \
            nfpm package --config build/nfpm.yaml --packager deb \
            --target "${GITHUB_WORKSPACE}/informer-ui-${{ github.ref_name }}-linux-amd64.deb"

      - name: Verify deb metadata and layout
        run: |
          dpkg-deb --info "informer-ui-${{ github.ref_name }}-linux-amd64.deb"
          dpkg-deb --contents "informer-ui-${{ github.ref_name }}-linux-amd64.deb" | grep /usr/bin/informer-ui

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            informer-ui-${{ github.ref_name }}-linux-amd64.tar.gz
            informer-ui-${{ github.ref_name }}-linux-amd64.deb
          if-no-files-found: error

  # the aggregate job only collects and publishes. It depends on every
  # platform job, so a partial set of assets never becomes a release; a rerun
  # of the same tag updates the same release with identically named assets.
  publish:
    name: Publish GitHub Release
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    steps:

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      # Fixed name SHA256SUMS so the in-app GitHub updater provider can find it
      # without knowing the release tag. The file never lists itself.
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd artifacts
          mapfile -t assets < <(find . -maxdepth 1 -type f -printf '%P\n' | sort)
          test "${#assets[@]}" -gt 0
          sha256sum "${assets[@]}" > "${RUNNER_TEMP}/SHA256SUMS"
          cat "${RUNNER_TEMP}/SHA256SUMS"
          mv "${RUNNER_TEMP}/SHA256SUMS" .

      - name: List release assets
        run: ls -la artifacts

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
