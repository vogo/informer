version: "2"
linters:
  default: all
  disable:
    - cyclop
    - depguard
    # Keep deprecated names disabled while default: all still includes them.
    - exhaustruct
    - exhaustruct_v5
    - forcetypeassert
    - gochecknoglobals
    - gomodguard
    - ireturn
    - lll
    - mnd
    - noctx
    - tagliatelle
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    dupl:
      threshold: 100
    goconst:
      ignore-tests: true
      min-len: 2
      min-occurrences: 2
    gocritic:
      disabled-checks:
        - wrapperFunc
      enabled-tags:
        - performance
        - style
        - experimental
    gocyclo:
      min-complexity: 17
    gomoddirectives:
      # the desktop entry is a nested module that shares the root service
      # layer through a local replace; that is the intended monorepo layout.
      replace-local: true
      replace-allow-list:
        - github.com/vogo/informer
    lll:
      line-length: 140
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Persisted legacy field names are part of the source model and bindings.
      - linters: [revive]
        path: internal/feed/(model|db_test)\.go$
        text: 'struct field Json(Title|URL)Path should be JSON(Title|URL)Path'
      # CLI commands intentionally write their results to stdout.
      - linters: [forbidigo]
        path: internal/cli/
      # These fixtures exercise Chinese category names and CLI output.
      - linters: [gosmopolitan]
        path: internal/(cli/feed|feed/db|service/crud)_test\.go$
      # These tests mutate stdout or process-wide HTTP configuration.
      - linters: [paralleltest]
        path: internal/(cli/.*_test|feed/(db|feed)_test|httpx/proxy_test)\.go$
      # Service integration tests swap process-wide HTTP clients and Agent
      # guards, so they remain sequential even though databases are instance bound.
      - linters:
          - paralleltest
        path: internal/service/.*_test\.go
      # the ding, lark and soup tests swap the package level delivery client to
      # shorten the production 60s deadline, a write to a shared global; the
      # tests of each package therefore have to stay sequential.
      - linters:
          - paralleltest
        path: internal/(ding|lark|soup)/.*_test\.go
      # The push timeout tests swap outbound clients; processing integration
      # tests also use process-wide HTTP clients and Agent guards.
      # Both must remain sequential.
      - linters:
          - paralleltest
        path: binding_(inform_timeout|processing)_test\.go
      - linters:
          - gosec
        text: Potential HTTP request made with variable url
      - linters:
          - gosec
        text: 'G108: Profiling endpoint is automatically exposed on /debug/pprof'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/vogo/informer)
    goimports:
      local-prefixes:
        - github.com/vogo/informer
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
