version: "2"
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - exhaustruct
    # golangci-lint v2.13 deprecated exhaustruct and wsl and shipped the live
    # versions under new names; the deprecated entries alone stop disabling
    # anything, so both spellings are listed until the old ones are dropped.
    - exhaustruct_v5
    - forcetypeassert
    - gochecknoglobals
    - gomodguard
    - ireturn
    - lll
    - mnd
    - noctx
    - tagliatelle
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    dupl:
      threshold: 100
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      disabled-checks:
        - wrapperFunc
      enabled-tags:
        - performance
        - style
        - experimental
    gocyclo:
      min-complexity: 17
    gomoddirectives:
      # the desktop entry is a nested module that shares the root service
      # layer through a local replace; that is the intended monorepo layout.
      replace-local: true
      replace-allow-list:
        - github.com/vogo/informer
    lll:
      line-length: 140
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # feed.InitFeedDB installs a package level database handle, so two services
      # opening at the same time would race. Every test of the service package
      # therefore has to stay sequential; this is a structural constraint of the
      # feed package, not an omission in the tests.
      - linters:
          - paralleltest
        path: internal/service/.*_test\.go
      # the ding, lark and soup tests swap the package level delivery client to
      # shorten the production 60s deadline, a write to a shared global; the
      # tests of each package therefore have to stay sequential.
      - linters:
          - paralleltest
        path: internal/(ding|lark|soup)/.*_test\.go
      # the manual push timeout tests swap the outbound clients of ding, lark
      # and soup for a short deadline; they must not overlap the parallel
      # trigger tests that exercise the production clients.
      - linters:
          - paralleltest
        path: binding_inform_timeout_test\.go
      - linters:
          - gosec
        text: Potential HTTP request made with variable url
      - linters:
          - gosec
        text: 'G108: Profiling endpoint is automatically exposed on /debug/pprof'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/vogo/informer)
    goimports:
      local-prefixes:
        - github.com/vogo/informer
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
